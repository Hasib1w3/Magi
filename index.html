<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title> 💩 Magi 🤡</title>
  <style id="ds">
    /* =====================================================================
    DESIGN SYSTEM. The only place a visual value is allowed to live.
    This exact sheet is also injected into every lesson iframe.
  
    COLOR RULES (do not add colors):
    1. Everything (page, panels, buttons, borders) is GRAY or WHITE.
    2. TEXT is the only thing that is BLACK.
    3. --blue is the ONLY extra color. Use it inside lessons for graphics
        that explain something (boxes, arrows, icons, code keywords).
    4. --mark is the highlighter: it marks the code lines to look at.
    ===================================================================== */
    :root {
      --bg: #ececee;
      --surface: #ffffff;
      --edge: #d6d6dc;
      --press: #e0e0e5;
      --text: #111111;
      --blue: #2f6df6;
      --blue-soft: #dce6ff;
      --mark: #fff0a3;
      --syn-key: var(--blue);
      --syn-fn: var(--blue);
      --syn-str: var(--text);
      --syn-num: var(--text);
      --syn-com: #75757f;

      /* SPACE: one responsive unit, everything is a multiple of it */
      --u: clamp(.5rem, 2.2vmin, 1.25rem);
      --gap: var(--u);
      /* row to row, column to column */
      --pad: calc(var(--u)*2);
      /* window edge and split divider to content */
      --radius: var(--u);
      --line: max(1px, .08rem);

      /* LAYOUT */
      --split-top: minmax(0, 1fr);
      --split-bottom: minmax(0, 1fr);
      --slots: 4;
      /* fixed number of buttons in an mcq */

      /* TYPE */
      --font-ui: system-ui, "Noto Sans Bengali", "Hind Siliguri", sans-serif;
      --font-code: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --fs-0: clamp(.8rem, 1.4vmin + .5rem, .95rem);
      --fs-1: clamp(.95rem, 1.8vmin + .5rem, 1.2rem);
      --fs-2: clamp(1rem, 2.4vmin + .5rem, 1.5rem);
      --fs-3: clamp(1.2rem, 3vmin + .6rem, 2rem);

      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }



    html {
      height: 100%;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: var(--fs-1)/1.6 var(--font-ui)
    }

    /* SHELL: top = lesson iframe, bottom = deck of buttons */
    .shell {
      height: 100%;
      display: grid;
      grid-template-rows: var(--split-top) var(--split-bottom)
    }

    .stage {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--surface)
    }

    .deck {
      display: grid;
      gap: var(--gap);
      padding: var(--pad);
      border-top: var(--line) solid var(--edge);
      background: var(--bg);
      overflow: auto;
      min-height: 0
    }

    .shell[data-col="true"] .deck {
      grid-template-columns: repeat(var(--slots), minmax(0, 1fr))
    }

    .shell[data-col="false"] .deck {
      grid-template-rows: repeat(var(--slots), minmax(min-content, 1fr))
    }

    .shell[data-col="false"] .btn:only-child {
      grid-row: var(--slots)
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: var(--gap);
      font: inherit;
      font-size: var(--fs-2);
      text-align: center;
      overflow-wrap: anywhere;
      color: var(--text);
      background: var(--surface);
      border: var(--line) solid var(--edge);
      border-radius: var(--radius);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent
    }

    .btn:active {
      background: var(--press)
    }

    @media (hover:hover) {
      .btn:hover {
        background: var(--press)
      }
    }

    .btn:focus-visible {
      outline: var(--line) solid var(--text);
      outline-offset: var(--line)
    }

    /* LESSON KIT: classes lesson html can use */
    .lesson {
      height: auto;
      min-height: 100%;
      padding: var(--pad);
      background: var(--surface)
    }

    .lesson>* {
      margin: 0
    }

    .lesson>*+* {
      margin-top: var(--gap)
    }

    .q {
      font-size: var(--fs-3);
      font-weight: 650;
      line-height: 1.35
    }

    .note {
      font-size: var(--fs-1)
    }

    code {
      font-family: var(--font-code);
      background: var(--bg);
      border-radius: calc(var(--u)/2);
      padding: 0 calc(var(--u)/2)
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--gap)
    }

    .row>.code {
      flex: 1 1 0;
      min-width: 0
    }

    .center {
      min-height: calc(100vh - var(--pad)*2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: var(--gap)
    }

    .center>* {
      margin: 0
    }

    .fail {
      display: flex;
      align-items: center;
      gap: var(--pad)
    }

    .g {
      display: block;
      flex: none;
      width: auto;
      height: calc(var(--u)*6);
      color: var(--blue)
    }

    .var {
      display: inline-flex;
      flex-direction: column;
      text-align: center;
      font-family: var(--font-code);
      border: var(--line) solid var(--blue);
      border-radius: var(--radius);
      overflow: hidden
    }

    .var b {
      padding: calc(var(--u)/2) var(--gap);
      background: var(--blue-soft);
      font-weight: 600
    }

    .var span {
      padding: calc(var(--u)/2) var(--gap);
      background: var(--surface)
    }

    /* CODE BLOCK (highlighted by the injected highlighter) */
    pre.code {
      margin: 0;
      padding: var(--gap) 0;
      overflow: auto;
      counter-reset: ln;
      background: var(--bg);
      border: var(--line) solid var(--edge);
      border-radius: var(--radius);
      font: var(--fs-1)/1.6 var(--font-code);
      color: var(--text)
    }

    .code .ln {
      display: block;
      min-height: 1.6em;
      padding: 0 var(--gap);
      white-space: pre;
      counter-increment: ln
    }

    .code .ln::before {
      content: counter(ln);
      display: inline-block;
      width: 2ch;
      margin-right: var(--gap);
      text-align: right;
      color: var(--syn-com)
    }

    .code .mark {
      background: var(--mark)
    }

    .code i {
      font-style: normal
    }

    .t-k {
      color: var(--syn-key);
      font-weight: 700
    }

    .t-f {
      color: var(--syn-fn)
    }

    .t-n {
      color: var(--syn-num);
      font-weight: 700
    }

    .code i.t-s {
      color: var(--syn-str);
      font-style: italic
    }

    .t-c {
      color: var(--syn-com)
    }
  </style>
</head>

<body>
  <main class="shell" id="app" data-kind="learn" data-col="false">
    <iframe class="stage" id="stage" sandbox="allow-scripts" title="lesson"></iframe>
    <div class="deck" id="deck" role="group"></div>
  </main>

  "*":["<p class='q'>না, bool না!</p>","<p class='note'>Boolean শুধু <code>True</code> আর     <code>False</code>।<br><code>3.0</code> একটা সংখ্যা — দশমিক পয়েন্ট আছে, তাই <b>float</b>।   </p>"]},
  "end_html":[
  "<div class='center'>",
    "<svg class='g' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round'       stroke-linejoin='round'>       <circle cx='12' cy='12' r='9' />       <path d='M8 12.5l3 3 5-6' />     </svg>",
    "<p class='q'>🎉 Class 1 শেষ!</p>",
    "<p class='note'>তুমি এখন জানো:</p>",
    "<p class='note'>✅ <code>print()</code> — স্ক্রিনে দেখাও<br>✅ Variable — নামওয়ালা বাক্স, <code>=</code> মানে       রাখো<br>✅ <b>String (str)</b> — লেখা, quotes লাগে<br>✅ <b>Integer (int)</b> — পুরো সংখ্যা<br>✅ <b>Float         (float)</b> — দশমিক সংখ্যা<br>✅ <b>Boolean (bool)</b> — True / False<br>✅ <code>type()</code> — ধরন দেখো<br>✅       Variable নামের নিয়ম<br>✅ <code>\"12\"</code> আর <code>12</code> এক না!</p>",
    "<p class='note'>পরের Class এ শিখবে: <b>if/else</b> আর <b>input()</b> 🚀</p>",
    "</div>"]}
  ]
  
</script>

  <script>
    /* FRAMEWORK. Nothing visual here: every look comes from the design system above. */
    const $ = id => document.getElementById(id), root = document.documentElement, app = $('app'), deck = $('deck'), stage = $('stage');
    const DS = $('ds').textContent, SLOTS = +getComputedStyle(root).getPropertyValue('--slots');
    const ICON = "<svg class='g' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3 2 20h20L12 3z'/><path d='M12 10v5M12 18v.01'/></svg>";
    const S = {
      ok: 'Understood', again: 'Start again',
      wrong: "<p class='q'>Not quite. Look again.</p>",
      end: "<div class='center'><p class='q'>Lesson complete</p></div>",
      fail: `<div class='center'><div class='fail'>${ICON}<div><p class='q'>Server error</p><p class='note'>Something went wrong. Please try again.</p></div></div></div>`
    };
    let LESSONS = [];

    /* runs INSIDE every lesson iframe: reports errors, highlights <pre class="code"> */
    function boot() {
      addEventListener('error', () => parent.postMessage('lesson-error', '*'));
      const K = /^(and|as|break|class|continue|def|elif|else|for|from|if|import|in|is|not|or|pass|return|while|True|False|None)$/,
        B = /^(print|input|len|range|int|str|float|list|type|min|max|sum|abs|round)$/,
        esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])),
        tok = s => s.replace(/("[^"]*"|'[^']*')|(#.*)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|([&<>])/g, (m, q, c, n, w, x) =>
          q ? `<i class="t-s">${esc(q)}</i>` : c ? `<i class="t-c">${esc(c)}</i>` : n ? `<i class="t-n">${n}</i>` :
            w ? (K.test(w) ? `<i class="t-k">${w}</i>` : B.test(w) ? `<i class="t-f">${w}</i>` : w) : esc(x));
      document.querySelectorAll('pre.code').forEach(p => {
        const hl = (p.dataset.hl || '').split(',').map(Number);
        p.innerHTML = p.textContent.replace(/^\n|\n$/g, '').split('\n').map((l, i) => `<span class="ln${hl.includes(i + 1) ? ' mark' : ''}">${tok(l)}</span>`).join('');
      });
    }
    const lines = h => [].concat(h ?? '').join('\n');
    const page = h => `<!doctype html><html data-theme="${root.dataset.theme || ''}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>${DS}</style></head><body class="lesson">${lines(h)}<script>(${boot})()<\/script></body></html>`;

    /* one renderer for every screen: view = {kind, col, html, btns:[{t, run}]} */
    function show(v) {
      app.dataset.kind = v.kind; app.dataset.col = !!v.col;
      deck.replaceChildren(...v.btns.map(b => Object.assign(document.createElement('button'), { className: 'btn', type: 'button', textContent: b.t, onclick: b.run })));
      stage.srcdoc = page(v.html);
    }
    const learnView = (html, run, kind = 'learn') => ({ kind, col: false, html, btns: [{ t: S.ok, run }] });
    const restart = html => ({ kind: 'learn', col: false, html, btns: [{ t: S.again, run: () => load(0) }] });
    const after = L => L.next == null ? show(restart(L.end_html ?? S.end)) : load(L.next);
    const wrongOf = (w, k) => w && typeof w == 'object' && !Array.isArray(w) ? (w[k] ?? w['*']) : w;

    /* the two states */
    const STATES = {
      learn: (L) => learnView(L.html, () => after(L)),
      mcq: (L, i) => {
        if (!Array.isArray(L.options) || L.options.length !== SLOTS || !Number.isInteger(L.answer) || L.answer < 0 || L.answer >= SLOTS) throw new Error('mcq needs ' + SLOTS + ' options and a valid answer');
        return { kind: 'mcq', col: !!L.is_column, html: L.html, btns: L.options.map((t, k) => ({ t, run: () => k === L.answer ? after(L) : show(learnView(wrongOf(L.wrong, k) ?? S.wrong, () => load(i))) })) };
      }
    };
    function load(i) {
      try { const L = LESSONS[i]; if (!L || !Object.hasOwn(STATES, L.state)) throw new Error('bad lesson index ' + i); show(STATES[L.state](L, i)) }
      catch (e) { fail(e) }
    }
    function fail(e) { console.error(e); show({ ...restart(S.fail), kind: 'fail' }) }

    addEventListener('message', e => { if (e.source === stage.contentWindow && e.data === 'lesson-error' && app.dataset.kind !== 'fail') fail('error inside lesson html') });
    try { LESSONS = JSON.parse($('lessons').textContent); load(0) } catch (e) { fail(e) }
  </script>
</body>
